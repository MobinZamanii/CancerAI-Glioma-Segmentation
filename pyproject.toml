[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glioma3d"
version = "1.0.0"
description = "Multi-task 3D U-Net for joint glioma segmentation and localisation on multi-parametric MRI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "nibabel",
    "torch>=2.1",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
baseline = ["monai"]          # plain `pip install monai`; do NOT use monai[nibabel]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
